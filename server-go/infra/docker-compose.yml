services:
  db:
    image: postgres:17
    container_name: linkaroo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: linkaroo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkaroo"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: linkaroo-adminer
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"

volumes:
  postgres_data: